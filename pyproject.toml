[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-find-my-ha"
version = "0.1.0"
description = "Home Assistant MQTT publisher for Google Find My devices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "undetected-chromedriver>=3.5.5",
    "selenium>=4.27.1",
    "gpsoauth>=1.1.1",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "pyscrypt>=1.6.2",
    "cryptography>=43.0.3",
    "pycryptodomex>=3.21.0",
    "ecdsa>=0.19.0",
    "pytz>=2024.2",
    "protobuf>=5.28.3",
    "frida>=16.5.6",
    "httpx>=0.28.0",
    "h2>=4.1.0",
    "aiohttp>=3.11.8",
    "http_ece>=1.1.0",
    "paho-mqtt",
    "firebase-messaging",
    "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "tox>=4.0",
    "tox-uv>=1.0",
]

[tool.setuptools]
py-modules = ["chrome_driver", "publish_mqtt"]

[tool.setuptools.packages.find]
include = ["google_find_my_ha*"]
exclude = ["google_find_my_ha.Auth.firebase_messaging_broken*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
