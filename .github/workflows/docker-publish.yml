name: Docker Publish

on:
  push:
    tags:
      - "*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --tag pdist/google-find-my-ha:${{ github.ref_name }} \
            --tag pdist/google-find-my-ha:latest \
            .

      - name: Push Docker image
        run: |
          docker push pdist/google-find-my-ha:${{ github.ref_name }}
          docker push pdist/google-find-my-ha:latest
